name: release

# Prebuilt sestrian-node binaries, so nobody has to install Rust to run a node
# and so the npm CLI has something to download.
#
#   git tag v0.3.0 && git push origin v0.3.0   -> publishes to that release
#   workflow_dispatch                          -> refreshes `devnet-latest` only
#
# Every archive is covered by a single SHA256SUMS built in the publish job, which
# is what the npm installer verifies against before it will run a binary.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN: sestrian-node

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            smoke: full          # runs --help AND the preflight path
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            # libc6-dev-arm64-cross is REQUIRED, not a nicety: `ring` compiles C,
            # and with only the cross COMPILER installed it falls back to the
            # host's x86 /usr/include and dies on bits/libc-header-start.h.
            apt: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            linker: aarch64-linux-gnu-gcc
            strip: aarch64-linux-gnu-strip
            smoke: arch          # cross-built: verify the arch, can't execute
            arch_pattern: ARM aarch64
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
            smoke: help
          # Cross-built from the arm64 runner on purpose. macos-13 is the last
          # Intel image and is being retired: a v0.3.0 job sat queued for 37
          # minutes and never picked up a runner. Apple's SDK is universal, so
          # clang targets x86_64 from arm without extra toolchain. Trade-off:
          # this binary ships without ever executing (no Rosetta on the arm
          # runners), so the arch check below is all that stands behind it.
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
            smoke: arch
            arch_pattern: x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            smoke: help
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
          key: ${{ matrix.target }}

      - name: cross-compilation toolchain
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: build
        working-directory: node
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.linker }}
        run: cargo build --release --bin sestrian-node --target ${{ matrix.target }}

      - name: strip
        if: runner.os != 'Windows'
        run: ${{ matrix.strip || 'strip' }} node/target/${{ matrix.target }}/release/$BIN || true

      # A binary that will not execute must fail the job, never get published.
      # Listed positively: a cross-built target CANNOT run here, so `!= none`
      # would drag aarch64-linux in and fail it on Exec format error.
      - name: smoke — it runs at all
        if: (matrix.smoke == 'help' || matrix.smoke == 'full') && runner.os != 'Windows'
        run: node/target/${{ matrix.target }}/release/$BIN --help > /dev/null

      - name: smoke — it runs at all (windows)
        if: runner.os == 'Windows'
        run: node\target\${{ matrix.target }}\release\sestrian-node.exe --help > $null

      # A cross-built binary can't run here, so at least prove it is the right
      # architecture and not an accidentally-native build wearing the wrong name.
      - name: smoke — correct architecture (cross-built)
        if: matrix.smoke == 'arch'
        run: |
          set -euo pipefail
          f=$(file -b "node/target/${{ matrix.target }}/release/$BIN")
          echo "$f"
          echo "$f" | grep -q '${{ matrix.arch_pattern }}' \
            || { echo "expected a ${{ matrix.arch_pattern }} binary, got: $f"; exit 1; }

      # Deeper: prove the real preflight path works on a throwaway local chain.
      - name: smoke — preflight on a local toy chain
        if: matrix.smoke == 'full'
        env:
          # QUOTED deliberately: unquoted, GitHub Actions turns a 64-digit value
          # into scientific notation (1.111...e+63), the node gets a non-hex seed
          # and panics in hex::decode. Cost us a red build to learn.
          SESTRIAN_KEY_SEED: "1111111111111111111111111111111111111111111111111111111111111111"
        run: |
          set -euo pipefail
          test ${#SESTRIAN_KEY_SEED} -eq 64 || { echo "seed mangled by YAML: ${#SESTRIAN_KEY_SEED} chars"; exit 1; }
          # v1: --toy-dim is gone (the state must match a real page table). A
          # zeros vector of the LOCAL network's exact dimension (toy-moe:
          # 332,416 params) is a valid --check input — local bakes no root, so
          # the preflight exercises identity/disk/genesis-shape without torch.
          python3 -c "import struct,sys; sys.stdout.buffer.write(b'\x00'*8*332416)" > /tmp/smoke-genesis.bin
          node/target/${{ matrix.target }}/release/$BIN --check \
            --network local --genesis-file /tmp/smoke-genesis.bin \
            --data-dir "$(mktemp -d)"

      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/$BIN-${{ matrix.target }}.tar.gz" \
              -C "node/target/${{ matrix.target }}/release" "$BIN"
          ls -l dist

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Force `
            -Path "node/target/${{ matrix.target }}/release/sestrian-node.exe" `
            -DestinationPath "dist/sestrian-node-${{ matrix.target }}.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged

      - name: collect + checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          find staged -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          cd dist
          # List archives explicitly and sorted: `sha256sum *` can race its own
          # output file into the glob, and a stable order keeps diffs readable.
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            | sed 's|^\./||' | sort | xargs sha256sum > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS

      # Always downloadable, even for an untagged workflow_dispatch run.
      - uses: actions/upload-artifact@v4
        with:
          name: sestrian-node-binaries
          path: dist/*
          if-no-files-found: error

      # Upload every archive, then SHA256SUMS, then verify the release actually
      # holds what the manifest claims.
      #
      # `gh release upload --clobber` deletes an asset before re-uploading it, so
      # a transient API error mid-run leaves the release ADVERTISING a file it no
      # longer has. That is exactly what happened on v0.3.2: an HTTP 502 dropped
      # the Windows zip while SHA256SUMS still listed it, and every Windows user
      # falling back to this tag would have hit a 404. Hence: retries, checksums
      # last so the manifest is never newer than the binaries it describes, and a
      # final readback that fails the job rather than leaving a half-published
      # release looking green.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail

          upload() {   # upload <tag> <file...> — with backoff, because 5xx happens
            local tag="$1"; shift
            for f in "$@"; do
              local n=0
              until gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$f"; do
                n=$((n + 1))
                if [ "$n" -ge 5 ]; then
                  echo "::error::giving up uploading $f to $tag after $n attempts"
                  return 1
                fi
                echo "upload of $f failed (attempt $n) — retrying in $((n * 10))s"
                sleep $((n * 10))
              done
            done
          }

          # Every archive must be present and match SHA256SUMS, or the tag is not
          # safe to hand to the installer.
          verify() {
            local tag="$1" tmp
            tmp="$(mktemp -d)"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$tmp" --clobber
            ( cd "$tmp" && sha256sum --check --strict SHA256SUMS )
            echo "verified $tag: $(grep -c . "$tmp/SHA256SUMS") assets match their checksums"
            rm -rf "$tmp"
          }

          publish_to() {
            local tag="$1"
            # Binaries first, manifest last: if we die in between, SHA256SUMS is
            # stale rather than describing assets that were never uploaded.
            upload "$tag" dist/*.tar.gz dist/*.zip
            upload "$tag" dist/SHA256SUMS
            verify "$tag"
          }

          if [ "$IS_TAG" = "true" ]; then
            tag="${GITHUB_REF_NAME}"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                   --title "sestrian-node $tag" --generate-notes
            publish_to "$tag"
          fi

          # A stable URL that always points at the newest build, so docs and the
          # npm installer have something durable to fall back to between tags.
          gh release view devnet-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create devnet-latest --repo "$GITHUB_REPOSITORY" --prerelease \
                 --title "sestrian-node (latest devnet build)" \
                 --notes "Rolling build of the node binary from the default branch. Pinned releases live under \`v*\` tags; this tag moves."
          publish_to devnet-latest
