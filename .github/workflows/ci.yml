name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly run for the soak job (and free extra coverage of everything else).
  schedule:
    - cron: '17 4 * * *'

jobs:
  # The consensus core + node: must build warning-clean, pass all tests.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
      - name: build (warnings are errors)
        working-directory: node
        run: cargo build --release --all-targets
        env:
          RUSTFLAGS: "-D warnings"
      - name: test
        working-directory: node
        run: cargo test --all
      # The wallet-encryption round-trip is #[ignore]d because argon2id MODERATE
      # crawls unoptimised (~16s vs ~1s). It guards a nasty failure — a node that
      # writes wallets only it can open, not the Python client — so run it here,
      # in release, reusing the binaries the build step already produced. Named
      # explicitly: the other #[ignore]d test is a cost benchmark, not correctness.
      - name: wallet interop (release; too slow in debug)
        working-directory: node
        run: cargo test --release --bin sestrian-node encrypted_wallet_round_trips -- --ignored
      # clippy + fmt are advisory until a repo-wide normalization pass lands
      - name: clippy (advisory)
        working-directory: node
        run: cargo clippy --all-targets || true
      - name: fmt check (advisory)
        working-directory: node
        run: cargo fmt --check || true

  # The npx CLI. Its genesis download is the one path that takes 650MB of
  # consensus state off the network and writes it to disk, so its checksum
  # guards are tested against deliberately corrupt manifests. Node 18 is the
  # floor declared in package.json — test there too, since the newest Node has
  # built-in zstd and would hide a break in the fallback path.
  npm-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '22', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: zstd fallback must exist for Node without built-in zstd
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd
      - name: cli loads and prints usage without touching the network
        working-directory: npm
        run: node bin/sestrian.js --help
      - name: tests
        working-directory: npm
        run: npm test

  # The Python rig is the SPEC. Regenerate the golden vectors and assert the
  # committed file is byte-identical — this is what pins the Rust node to the
  # reference. A drift here means Rust and Python disagree.
  golden-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: regenerate golden vectors from the Python reference
        run: uv run --python 3.11 --with numpy --with pynacl python -m scripts.golden_vectors
      - name: assert golden.json is unchanged (Rust == Python spec)
        run: git diff --exit-code node/vectors/golden.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
      - name: rust reproduces every golden vector
        working-directory: node
        run: cargo test --test golden

  # Build the immutable release image; push it (tagged by SHA + latest) on main.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: log in to ghcr (main only)
        # push events only: the nightly schedule also runs on main, but must
        # not re-publish images for an unchanged tree
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: ghcr.io/sestrian/sestrian-node:ci
          cache-from: type=gha,scope=node
          cache-to: type=gha,mode=max,scope=node
      # Prove it runs BEFORE publishing it.
      - name: node image starts
        run: docker run --rm ghcr.io/sestrian/sestrian-node:ci --help > /dev/null
      - name: publish node image (main only)
        # push events only: the nightly schedule also runs on main, but must
        # not re-publish images for an unchanged tree
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/sestrian/sestrian-node:latest
            ghcr.io/sestrian/sestrian-node:${{ github.sha }}
          cache-from: type=gha,scope=node

  # The MINING image: node + PyTorch trainer. Separate from the node image
  # because torch is heavy and a watch/serve/relay node has no use for it. CI
  # publishes the CPU flavour; build --build-arg TORCH_FLAVOR=cu121 for NVIDIA.
  miner-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.miner
          build-args: TORCH_FLAVOR=cpu
          load: true
          push: false
          tags: ghcr.io/sestrian/sestrian-miner:ci
          cache-from: type=gha,scope=miner
          cache-to: type=gha,mode=max,scope=miner
      # The entrypoint must REFUSE to start without a genesis rather than run a
      # node that can never sync. Verify that guard actually fires.
      - name: miner refuses to start misconfigured
        run: |
          if docker run --rm ghcr.io/sestrian/sestrian-miner:ci 2>&1 | tee /tmp/o | grep -q "no genesis at"; then
            echo "missing-genesis guard fired correctly"
          else
            echo "guard did NOT fire; output was:"; cat /tmp/o; exit 1
          fi
      - name: log in to ghcr (main only)
        # push events only: the nightly schedule also runs on main, but must
        # not re-publish images for an unchanged tree
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish miner image (main only)
        # push events only: the nightly schedule also runs on main, but must
        # not re-publish images for an unchanged tree
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.miner
          build-args: TORCH_FLAVOR=cpu
          push: true
          tags: |
            ghcr.io/sestrian/sestrian-miner:latest
            ghcr.io/sestrian/sestrian-miner:${{ github.sha }}
          cache-from: type=gha,scope=miner

  # The reference test suite. BLOCKING: the rig is the spec, and a red spec
  # means the consensus reference itself regressed.
  python-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt
      - name: pytest
        run: |
          uv run --python 3.11 -r requirements-dev.txt \
            python -m pytest tests/ -q

  # Two nodes + two CPU trainers on the toy model must produce blocks and
  # converge to identical lineage — the end-to-end consensus smoke test.
  # BLOCKING. Logs land in /tmp/devnet*.log; uploaded on failure.
  devnet-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: devnet converges
        run: bash scripts/devnet.sh 90
      - name: upload devnet logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devnet-logs
          path: /tmp/devnet*.log
          if-no-files-found: ignore

  # Chaos soak: same two-node devnet but one node is SIGKILLed mid-run and must
  # fast-boot, catch up, and still converge. Too slow to gate every PR — runs
  # on pushes to main and on the nightly schedule.
  soak:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: soak survives a mid-run kill
        run: bash scripts/soak.sh 120 45
      - name: upload soak logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-logs
          path: /tmp/soak*.log
          if-no-files-found: ignore
