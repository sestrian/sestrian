name: pages

# Publish site/ to sestrian.com. The CNAME file in site/ pins the custom domain,
# so a deploy can never silently drop it.
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/chain_snapshot.py', '.github/workflows/pages.yml']
  # Refresh the live panel's baked chain snapshot without needing a commit.
  # Deploy-only: nothing is written back to the repo, so this costs no history.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; don't cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap lastmod reads `git log` per page; the default depth-1
          # checkout would date every page to the tip commit.
          fetch-depth: 0
      - name: Sanity-check the site before publishing
        run: |
          test -f site/index.html || { echo "site/index.html missing"; exit 1; }
          grep -q sestrian.com site/CNAME || { echo "CNAME must pin sestrian.com"; exit 1; }
          # the published genesis id is a promise to testers — never ship a page
          # that contradicts the id compiled into the node. HARD failure: a
          # mismatched hash on the site means a stale or wrong deploy.
          if grep -rqo '[0-9a-f]\{64\}' site/*.html; then
            want=$(grep -o 'genesis_state_root: "[0-9a-f]*"' node/net/src/main.rs | head -1 | grep -o '[0-9a-f]\{64\}')
            for got in $(grep -rho '[0-9a-f]\{64\}' site/*.html | sort -u); do
              [ "$got" = "$want" ] || { echo "FATAL: site mentions hash $got but the network id is $want"; exit 1; }
            done
          fi
      # Bake a real chain snapshot into the artifact. It is NOT committed — the
      # deploy carries it — so a panel that refreshes every 30 min costs zero
      # commits. Writes ok:false and keeps going if the seed is down: a copy
      # change must never be blocked by node downtime.
      - name: snapshot the chain for the live panel
        run: python3 scripts/chain_snapshot.py site/chain.json

      # CACHE BUST. chain.js is served with max-age=600, so a fix to the live
      # panel could sit invisible in browsers for ten minutes after deploy —
      # which is exactly how a corrected panel still showed a stale height and
      # looked broken. Rewrite every reference to chain.js with a hash of its
      # CONTENT, so a changed file is a new URL and an unchanged file keeps its
      # cache. Done at deploy time; nothing to remember on the next edit.
      - name: cache-bust chain.js by content hash
        run: |
          H=$(md5sum site/chain.js | cut -c1-10)
          sed -i "s|src=\"chain\.js\(?v=[0-9a-f]*\)\?\"|src=\"chain.js?v=$H\"|g" site/*.html
          echo "chain.js -> ?v=$H"
          grep -ho 'chain\.js?v=[0-9a-f]*' site/*.html | sort -u

      # Built here, not committed: a hand-maintained sitemap rots, its dates
      # drift from the content, and crawlers learn to distrust lastmod. Derived
      # from the last commit that actually touched each page, and discovered
      # from site/*.html so a new page cannot silently miss it.
      - name: generate sitemap
        run: |
          git log -1 --format=%cI >/dev/null   # fail loudly if history is shallow
          python3 scripts/make_sitemap.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
