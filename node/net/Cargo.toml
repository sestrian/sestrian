[package]
name = "sestrian-node"
version = "0.3.2"
edition = "2021"
description = "The production Sestrian node: libp2p networking (NAT-traversing), PyTorch training bridge, persistence, HTTP API — over the bit-exact consensus core"

[[bin]]
name = "sestrian-node"
path = "src/main.rs"

[dependencies]
sestrian-core = { path = "../core" }
libp2p = { version = "0.55", features = [
    "tokio", "gossipsub", "noise", "yamux", "tcp", "quic", "identify",
    "macros", "ed25519", "request-response", "json", "autonat", "dcutr",
    "relay", "ping",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "net", "io-util", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
crypto_secretbox = "0.1"
async-trait = "0.1"
futures = "0.3"
libc = "0.2"          # advisory flock on the data dir (single-writer guarantee)
zeroize = "1"         # wipe transient key material from memory after load
