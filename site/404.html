<style>
  /* Self-contained and webfont-free: an error page that waits on a font CDN is

  :root{
    --black:#0e0d0b; --bone:#ecebe4; --dim:#b4b1a6; --line:#2c2a25; --signal:#ff4d00;

  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;background:var(--black);color:var(--bone);

  a{color:inherit}
  .code{font-family:var(--mono);font-size:13px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--signal);margin:0 0 18px}
  h1{font-size:clamp(40px,9vw,110px);line-height:.95;margin:0 0 20px;
    font-weight:900;text-transform:uppercase;letter-spacing:-.02em}
  p{color:var(--dim);max-width:52ch;margin:0 0 30px;font-size:clamp(16px,2vw,19px)}
  .links{display:flex;gap:26px;flex-wrap:wrap;font-family:var(--mono);
    font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  .links a{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px}
  .links a:hover{color:var(--signal);border-color:var(--signal)}
</style>
</head>
