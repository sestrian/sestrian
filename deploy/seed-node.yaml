# Sestrian seed node — always-on bootstrap peer + relay for the network.
#
# v3: a StatefulSet with a PERSISTENT VOLUME (the chain store survives pod
# reschedule — no more emptyDir data loss) running the PREBUILT node image
# (deploy/Dockerfile, built + pushed by CI — no compile-on-boot). Identity comes
# from a k8s Secret; genesis is materialized onto the persistent volume by an
# init container, stamped with its id (/data/genesis.id), and reused until the
# declared GENESIS_ID changes — at which point the init container resets the
# chain store and regenerates (see the init container for details).
#
#   # one-time setup:
#   kubectl create secret generic sestrian-seed-key \
#     --from-literal=key-seed=$(head -c32 /dev/urandom | xxd -p -c64) -n sestrian
#   kubectl apply -f deploy/seed-node.yaml
#
#   gossip/relay:  <node-ip>:30980 (udp+tcp)     api:  http://<node-ip>:30981
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seed-node
  namespace: sestrian
  labels: {app: sestrian-seed}
spec:
  serviceName: seed-node
  replicas: 1
  selector:
    matchLabels: {app: sestrian-seed}
  template:
    metadata:
      labels: {app: sestrian-seed}
    spec:
      initContainers:
        # Materialize the deterministic genesis onto the persistent volume.
        # RESET-AWARE via a stamp file: /data/genesis.id records WHICH genesis
        # the PVC currently holds. When it matches GENESIS_ID this is a no-op;
        # on mismatch (a re-genesis — or a legacy pre-stamp PVC, which gets one
        # reset on first rollout) the old artifact AND the chain store it
        # materialized are wiped and the configured genesis is regenerated and
        # VERIFIED against GENESIS_ID before being stamped. No PVC surgery
        # needed to relaunch the network; the node identity lives in the k8s
        # Secret and is untouched.
        - name: genesis
          image: python:3.12-bookworm
          env:
            # Flip these three values (plus the node image) to relaunch on a
            # new genesis; GENESIS_ID is the published genesis_state_root.
            - name: GENESIS_ID
              value: "a597316003dbf12122b7cc6f39226ce7c8f7a871e58e7ddf364e56b08102527b"  # devnet-genesis-2 (PREVIEW until ceremony)
            - name: GENESIS_MODEL
              value: "small-moe"
            - name: GENESIS_SEED
              value: "20260822"
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              if [ -f /data/genesis.id ] && [ "$(cat /data/genesis.id)" = "$GENESIS_ID" ] \
                 && [ -f /data/genesis-seed.bin ]; then
                echo "genesis $GENESIS_ID already materialized (stamp matches)"; exit 0
              fi
              echo "genesis identity change: $([ -f /data/genesis.id ] && cat /data/genesis.id || echo '<unstamped>') -> $GENESIS_ID"
              # wipe the old artifact + every chain-store file the node
              # materializes in /data (see deploy/backup-restore.sh manifest);
              # nothing else lives on the PVC.
              rm -rf /data/genesis-seed.bin /data/genesis.bin /data/snapshot.bin \
                     /data/snapshot.json /data/blocks.jsonl /data/payloads \
                     /data/uploads /data/.lock /data/genesis.id
              # public repo: plain HTTPS clone, no deploy key needed
              git clone --depth 1 https://github.com/sestrian/sestrian.git /app
              cd /app
              pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
              pip install --no-cache-dir numpy pynacl
              python -m client.make_genesis --model "$GENESIS_MODEL" --seed "$GENESIS_SEED" \
                  --out /data/genesis-seed.bin | tee /tmp/genesis.log
              # a genesis that doesn't hash to the published id would put this
              # seed on a different chain — never stamp it, never start.
              if ! grep -q "$GENESIS_ID" /tmp/genesis.log; then
                echo "FATAL: generated genesis does NOT match published id $GENESIS_ID"
                rm -f /data/genesis-seed.bin; exit 1
              fi
              printf '%s\n' "$GENESIS_ID" > /data/genesis.id
              echo "genesis verified + stamped: $GENESIS_ID"
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: seed
          # CI builds + pushes this by git SHA; pin a digest in production.
          image: ghcr.io/sestrian/sestrian-node:latest
          args:
            - --data-dir=/data
            - --genesis-file=/data/genesis-seed.bin
            - --port=9800
            - --api-port=8080
            - --api-bind=0.0.0.0
            - --bridge-port=7999
            - --relay-server
            - --prune-depth=8
            - --data-contributor=3432d48fd6878b4f2e7a1e40cc15e112c512fae7
          env:
            - name: SESTRIAN_KEY_SEED
              valueFrom:
                secretKeyRef: {name: sestrian-seed-key, key: key-seed}
            # set to enable /upload + /chat; unset leaves them disabled (safe)
            - name: SESTRIAN_API_TOKEN
              valueFrom:
                secretKeyRef: {name: sestrian-seed-key, key: api-token, optional: true}
          ports:
            - {containerPort: 9800, protocol: UDP, name: gossip-udp}
            - {containerPort: 9800, protocol: TCP, name: gossip-tcp}
            - {containerPort: 8080, name: api}
          resources:
            requests: {cpu: "1", memory: 3Gi}
            limits: {cpu: "4", memory: 8Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            httpGet: {path: /status, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 30
          lifecycle:
            preStop:
              # give the node time to flush its final snapshot on SIGTERM
              exec: {command: ["sleep", "5"]}
      terminationGracePeriodSeconds: 40
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 30Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: seed-node
  namespace: sestrian
spec:
  type: NodePort
  selector: {app: sestrian-seed}
  ports:
    - {name: gossip-udp, port: 9800, targetPort: 9800, nodePort: 30980, protocol: UDP}
    - {name: gossip-tcp, port: 9800, targetPort: 9800, nodePort: 30980, protocol: TCP}
    - {name: api, port: 8080, targetPort: 8080, nodePort: 30981}
