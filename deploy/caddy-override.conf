# systemd drop-in for caddy.service, installed at
#   /etc/systemd/system/caddy.service.d/override.conf
#
# Loads the per-anchor values that deploy/Caddyfile references as
# {$SESTRIAN_HOSTNAMES} and {$SESTRIAN_PEER}, so every anchor runs the exact
# same Caddyfile and only this two-line env file differs between them.
[Service]
EnvironmentFile=/etc/caddy/anchor.env
